# Veröffentlicht die Pflege-Oberfläche (src/EnglishSteamTrainer.Admin) auf GitHub Pages:
#   https://<besitzer>.github.io/<repo>/
# Einmalig nötig: Repo-Einstellungen -> Pages -> Source: "GitHub Actions".
# Läuft auch bei Änderungen in content/, damit der Demo-Modus aktuell bleibt.
name: Pflege-Oberfläche

on:
  push:
    branches: [main]
    paths:
      - "src/EnglishSteamTrainer.Admin/**"
      - "src/EnglishSteamTrainer.Content/**"
      - "content/**"
      - ".github/workflows/admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Veröffentlichen
        run: dotnet publish src/EnglishSteamTrainer.Admin -c Release -o publish

      # Pages liefert die Seite unter /<repo>/ aus. 404.html = index.html, damit direkte
      # Links wie /<repo>/lernplan funktionieren.
      - name: Für GitHub Pages anpassen
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          grep -q '<base href="/${{ github.event.repository.name }}/" />' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
