# Baut und testet bei jedem Push - auch wenn nur Vokabeln oder die Sperrliste
# in content/ geändert wurden. Ein roter Haken heißt: Datei prüfen! (Die PCs
# übernehmen ungültige Dateien ohnehin nicht, sondern behalten die alte Version.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build EnglishSteamTrainer.sln -c Release

      - name: Tests (inkl. Prüfung aller Dateien in content/)
        run: dotnet test tests/EnglishSteamTrainer.Core.Tests -c Release --no-build
