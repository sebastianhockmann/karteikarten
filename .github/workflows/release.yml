# Neue Version veröffentlichen:
#   1. <Version> in Directory.Build.props hochzählen und committen
#   2. git tag v1.2.0 && git push origin v1.2.0
# Die installierten PCs holen sich das Release automatisch (scripts/Update.ps1).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Schutz gegen einen Tag auf dem falschen Commit (z. B. vor dem Commit gesetzt).
      - name: Tag passt zu Directory.Build.props
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($tag -ne $props) {
            throw "Tag v$tag passt nicht zu <Version>$props</Version> in Directory.Build.props. Version hochzaehlen, committen, pushen und dann erst taggen."
          }

      - name: Tests
        run: dotnet test tests/EnglishSteamTrainer.Core.Tests -c Release

      - name: Paket bauen
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/Build-Package.ps1 -Version $version -Zip

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/EnglishSteamTrainer-win-x64.zip
            artifacts/EnglishSteamTrainer-win-x64.zip.sha256
